name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker build --tag browserdock:ci .
      - name: Smoke-test the container
        env:
          BROWSERDOCK_API_KEY: ci-smoke-key-0123456789abcdef
        run: |
          docker run --detach --name browserdock --init --shm-size 1g \
            --publish 127.0.0.1:3000:3000 --env BROWSERDOCK_API_KEY browserdock:ci
          node scripts/docker-smoke.mjs || { docker logs browserdock; exit 1; }

