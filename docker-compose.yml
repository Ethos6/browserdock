services:
  browserdock:
    build: .
    restart: unless-stopped
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BROWSERDOCK_HOST: 0.0.0.0
      BROWSERDOCK_PORT: 3000
      BROWSERDOCK_MAX_CONCURRENT: 3
      BROWSERDOCK_MAX_TIMEOUT_MS: 30000
      # Set a long random key before exposing this service beyond localhost.
      # BROWSERDOCK_API_KEY: change-this-secret
